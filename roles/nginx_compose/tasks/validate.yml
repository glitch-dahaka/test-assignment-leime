---
- name: docker info
  ansible.builtin.command:
    argv: ["docker", "info"]
  changed_when: false

- name: docker compose version
  ansible.builtin.command:
    argv: ["docker", "compose", "version"]
  changed_when: false

- name: curl and openssl are installed
  ansible.builtin.command:
    argv: ["{{ item }}", "--version"]
  loop:
    - curl
    - openssl
  changed_when: false

- name: Check deploy settings
  ansible.builtin.assert:
    that:
      - nginx_deploy_dir is match('^/')
      - nginx_http_port | int > 0
      - nginx_https_port | int > 0
      - (nginx_http_port | int) != (nginx_https_port | int)
      - nginx_domains is sequence
      - nginx_domains is not string
      - nginx_compose_project_name is match('^[A-Za-z0-9_-]+$')
    fail_msg: nginx_deploy_dir must be absolute, ports must differ, project name must be plain.

- name: Check certbot settings
  ansible.builtin.assert:
    that:
      - certbot_email is search('@')
      - certbot_agree_tos | bool
      - not ((certbot_server | length > 0) and (certbot_staging | bool))
      - not (nginx_local_acme | bool) or certbot_server is match('^https://')
    fail_msg: >-
      Set certbot_email and certbot_agree_tos.
      Do not set certbot_server together with certbot_staging.
      Local ACME needs an https:// certbot_server.

- name: Check domain names
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - item.name is not search('\\.\\.')
    fail_msg: "bad domain name: {{ item.name | default('(empty)') }}"
  no_log: true
  loop: "{{ nginx_domains }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

- name: Check aliases
  ansible.builtin.assert:
    that:
      - item.1 is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - item.1 is not search('\\.\\.')
    fail_msg: "bad alias {{ item.1 }} on {{ item.0.name }}"
  no_log: true
  loop: "{{ nginx_domains | subelements('aliases', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"

- name: Check locations
  vars:
    mode_count: >-
      {{
        ((item.1.proxy_pass is defined) | ternary(1, 0))
        + ((item.1.root is defined) | ternary(1, 0))
        + ((item.1.alias is defined) | ternary(1, 0))
        + ((item.1.return is defined) | ternary(1, 0))
      }}
  ansible.builtin.assert:
    that:
      - item.1.path is match('^/[A-Za-z0-9._~/=-]*$')
      - mode_count | trim | int == 1
      - item.1.proxy_pass is not defined or item.1.proxy_pass is match('^https?://[A-Za-z0-9._:-]+(/.*)?$')
      - item.1.return is not defined or item.1.return is match('^[1-5][0-9]{2}(\s+.*)?$')
      - item.1.root is not defined or item.1.root is match('^/[A-Za-z0-9._/-]+$')
      - item.1.alias is not defined or item.1.alias is match('^/[A-Za-z0-9._/-]+$')
      - item.1.host_path is not defined or item.1.host_path is match('^/[A-Za-z0-9._/-]+$')
      - item.1.index is not defined or item.1.index is match('^[A-Za-z0-9._-]+$')
    fail_msg: "bad location {{ item.1.path | default('?') }} on {{ item.0.name }}"
  no_log: true
  loop: "{{ nginx_domains | subelements('locations', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}{{ item.1.path | default('?') }}"

- name: Stat static host paths
  ansible.builtin.stat:
    path: "{{ item.1.host_path }}"
  register: static_host_paths
  changed_when: false
  loop: "{{ nginx_domains | subelements('locations', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}{{ item.1.path }}"
  when: item.1.host_path is defined
  no_log: true

- name: Static host paths exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "missing {{ item.item.1.host_path }} for {{ item.item.0.name }}{{ item.item.1.path }}"
  no_log: true
  loop: "{{ static_host_paths.results }}"
  loop_control:
    label: "{{ item.item.1.host_path | default('skipped') }}"
  when: not (item.skipped | default(false))

- name: Collect server names
  ansible.builtin.set_fact:
    nginx_server_names: "{{ nginx_server_names | default([]) + [item.name] + (item.aliases | default([])) }}"
  no_log: true
  loop: "{{ nginx_domains }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Server names are unique
  ansible.builtin.assert:
    that:
      - nginx_server_names | unique | length == nginx_server_names | length
    fail_msg: "duplicate server_name: {{ nginx_server_names }}"
  when: nginx_domains | length > 0

- name: Check basic auth users
  ansible.builtin.include_tasks: validate_users.yml
  loop: "{{ nginx_domains }}"
  loop_control:
    loop_var: domain
    label: "{{ domain.name }}"
  no_log: true
  when: (domain.basic_auth | default({})).enabled | default(false) | bool
